<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Margin Watcher">
  <meta name="theme-color" content="#f97316">
  <title>Procurement & Margin Watcher</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      padding-top: env(safe-area-inset-top);
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
    }
    .safe-bottom { padding-bottom: calc(env(safe-area-inset-bottom) + 5.5rem); }
    .fab { bottom: calc(env(safe-area-inset-bottom) + 1.25rem); }
    .spin { animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes slideUp { from { transform: translateY(8px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .slide-up { animation: slideUp 0.2s ease-out; }
  </style>
</head>
<body class="bg-gray-50 text-gray-900 font-sans min-h-screen">

  <!-- Header -->
  <header class="bg-orange-500 text-white px-4 pt-3 pb-3 sticky top-0 z-40 shadow-md">
    <div class="flex items-center justify-between max-w-lg mx-auto">
      <div>
        <h1 class="text-lg font-bold leading-tight tracking-tight">Margin Watcher</h1>
        <p id="lastScan" class="text-xs text-orange-100 mt-0.5">Verbinde...</p>
      </div>
      <button onclick="manualSync()" id="syncBtn" title="Gmail jetzt scannen"
        class="bg-orange-600 hover:bg-orange-700 active:bg-orange-800 rounded-full w-9 h-9 flex items-center justify-center transition-colors">
        <svg id="syncIcon" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"
            d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- Main -->
  <main class="max-w-lg mx-auto px-4 py-4 safe-bottom">

    <!-- Status Cards -->
    <div class="grid grid-cols-3 gap-2.5 mb-5">
      <div class="bg-red-50 border border-red-200 rounded-xl p-3 text-center">
        <div id="countCritical" class="text-2xl font-bold text-red-600">–</div>
        <div class="text-xs text-red-500 font-semibold mt-0.5">Kritisch</div>
      </div>
      <div class="bg-yellow-50 border border-yellow-200 rounded-xl p-3 text-center">
        <div id="countWarning" class="text-2xl font-bold text-yellow-600">–</div>
        <div class="text-xs text-yellow-500 font-semibold mt-0.5">Warnung</div>
      </div>
      <div class="bg-green-50 border border-green-200 rounded-xl p-3 text-center">
        <div id="countOk" class="text-2xl font-bold text-green-600">–</div>
        <div class="text-xs text-green-500 font-semibold mt-0.5">OK heute</div>
      </div>
    </div>

    <!-- Pending Mappings -->
    <div id="mappingSection" class="hidden mb-5">
      <h2 class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-2">Produkt-Zuordnung prüfen</h2>
      <div id="mappingsList"></div>
    </div>

    <!-- Open Alerts -->
    <div class="mb-5">
      <h2 class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-2">Offene Warnungen</h2>
      <div id="alertsList">
        <div class="flex items-center justify-center py-10 text-gray-300">
          <svg class="spin w-6 h-6 mr-2" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4l3-3-3-3v4a8 8 0 00-8 8h4z"/>
          </svg>
          <span class="text-sm">Lade Daten...</span>
        </div>
      </div>
    </div>

    <!-- Recent Scans -->
    <div>
      <h2 class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-2">Letzte Scans</h2>
      <div id="recentScans" class="bg-white rounded-xl border border-gray-200 divide-y divide-gray-100 overflow-hidden">
        <p class="text-sm text-gray-400 py-5 text-center">Noch keine Scans</p>
      </div>
    </div>
  </main>

  <!-- FAB: Kamera -->
  <button onclick="openCamera()"
    class="fab fixed right-4 bg-orange-500 hover:bg-orange-600 active:scale-95 text-white rounded-full w-14 h-14 shadow-2xl flex items-center justify-center z-50 transition-all">
    <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
        d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/>
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"/>
    </svg>
  </button>

  <!-- Camera Modal -->
  <div id="cameraModal" class="fixed inset-0 bg-black z-50 hidden flex flex-col">
    <div class="flex-1 flex flex-col max-w-lg mx-auto w-full p-4"
         style="padding-top: max(1rem, env(safe-area-inset-top));">
      <div class="flex items-center mb-4">
        <button onclick="closeCameraModal()" class="text-white p-2 -ml-2 rounded-full hover:bg-white/10">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
        <h2 class="text-white text-base font-semibold ml-2">Lieferschein scannen</h2>
      </div>

      <!-- Image Preview -->
      <div id="imagePreview"
        class="bg-gray-900 rounded-2xl flex items-center justify-center mb-4 overflow-hidden"
        style="min-height: 220px; max-height: min(55vh, 400px);">
        <div class="text-center text-gray-600 px-6">
          <svg class="w-14 h-14 mx-auto mb-3 opacity-30" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
              d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
          </svg>
          <p class="text-sm text-gray-500">Foto aufnehmen oder Datei auswählen</p>
        </div>
      </div>

      <!-- OCR Result Preview -->
      <div id="ocrResult" class="hidden bg-gray-900 rounded-xl p-3 mb-3 max-h-28 overflow-y-auto">
        <p class="text-xs text-gray-500 font-semibold mb-1">Erkannter Text:</p>
        <p id="ocrText" class="text-xs text-green-400 font-mono leading-relaxed break-all"></p>
      </div>

      <!-- Action Buttons -->
      <div class="space-y-2.5 mt-auto pb-2" style="padding-bottom: max(0.5rem, env(safe-area-inset-bottom));">
        <label class="block bg-orange-500 hover:bg-orange-600 text-white text-center py-3.5 rounded-2xl font-semibold cursor-pointer active:scale-95 transition-all select-none">
          <span>Foto aufnehmen</span>
          <input type="file" accept="image/*" capture="environment" id="cameraInput" class="hidden" onchange="handleImageCapture(event)">
        </label>
        <label class="block bg-gray-800 hover:bg-gray-700 text-white text-center py-3 rounded-2xl font-medium cursor-pointer active:scale-95 transition-all select-none text-sm">
          <span>Aus Bibliothek wählen</span>
          <input type="file" accept="image/*,application/pdf" id="libraryInput" class="hidden" onchange="handleImageCapture(event)">
        </label>
        <button id="processBtn" onclick="processImage()"
          class="w-full bg-green-600 hover:bg-green-700 text-white py-3.5 rounded-2xl font-semibold hidden active:scale-95 transition-all">
          Lieferschein verarbeiten →
        </button>
      </div>
    </div>
  </div>

  <!-- Processing Overlay -->
  <div id="processingOverlay" class="fixed inset-0 bg-black/70 z-[60] hidden flex items-center justify-center">
    <div class="bg-white rounded-2xl p-6 text-center mx-5 shadow-2xl max-w-xs w-full">
      <div class="spin w-10 h-10 border-4 border-orange-500 border-t-transparent rounded-full mx-auto mb-3"></div>
      <p id="processingText" class="font-semibold text-gray-800">Analysiere Lieferschein...</p>
      <p class="text-xs text-gray-400 mt-1">Google Drive OCR läuft</p>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="fixed left-1/2 -translate-x-1/2 z-[70] hidden"
       style="top: calc(env(safe-area-inset-top) + 4.5rem);">
    <div id="toastContent" class="rounded-xl px-4 py-2 text-white text-sm font-medium shadow-xl slide-up"></div>
  </div>

  <script src="js/config.js" onerror="showConfigError()"></script>
  <script src="js/app.js"></script>
</body>
</html>
